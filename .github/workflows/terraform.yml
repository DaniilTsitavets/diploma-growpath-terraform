name: terraform

on:
  workflow_call:
    inputs:
      layer:
        type: string
        required: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  ACCOUNT_EMAILS: ${{ secrets.TF_ACCOUNT_EMAILS }}
  BUDGET_EMAIL: ${{ secrets.TF_BUDGET_EMAIL }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-${{ inputs.layer }}-plan-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: infra/${{ inputs.layer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare backend and variables
        working-directory: .
        run: .github/scripts/prepare.sh "${{ inputs.layer }}"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: eu-north-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=5m -no-color

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: management
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-${{ inputs.layer }}-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/${{ inputs.layer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare backend and variables
        working-directory: .
        run: .github/scripts/prepare.sh "${{ inputs.layer }}"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: eu-north-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform apply -input=false -lock-timeout=5m -auto-approve -no-color
